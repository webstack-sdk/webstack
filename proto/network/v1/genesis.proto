syntax = "proto3";
package network.v1;

import "gogoproto/gogo.proto";
import "network/v1/network.proto";

option go_package = "github.com/webstack-sdk/webstack/x/network/types";

// NodeStatusCounter pairs a node address with its daily status-update
// counter for genesis import/export.
message NodeStatusCounter {
  // node_address is the node the counter belongs to.
  string node_address = 1;
  // counter is the node's rolling daily status-update counter.
  ActivityCounter counter = 2 [(gogoproto.nullable) = false];
}

// GaslessCounter is one gasless-admission daily counter for genesis
// import/export, keyed by counter kind and signer address.
message GaslessCounter {
  // kind is the admission counter kind ("authorize", "activate",
  // "deactivate").
  string kind = 1;
  // signer is the address the counter is keyed on.
  string signer = 2;
  // counter is the rolling daily counter.
  ActivityCounter counter = 3 [(gogoproto.nullable) = false];
}

// GenesisState defines the network module's genesis state. The denormalized
// structures (operator set, operator-node index, per-operator node counts,
// and the recent-activity index) are derived from nodes and activation_keys
// on import rather than exported, so they can never disagree with the
// primary records.
message GenesisState {
  // params are the module parameters.
  Params params = 1 [(gogoproto.nullable) = false];
  // nodes are all node records, active and deactivated.
  repeated Node nodes = 2 [(gogoproto.nullable) = false];
  // activation_keys are all activation key records, active and disabled.
  repeated ActivationKey activation_keys = 3 [(gogoproto.nullable) = false];
  // node_status_counters are the per-node daily status-update counters.
  repeated NodeStatusCounter node_status_counters = 4 [(gogoproto.nullable) = false];
  // gasless_counters are the ante-admission daily counters, exported so an
  // export/import does not reset gasless quotas.
  repeated GaslessCounter gasless_counters = 5 [(gogoproto.nullable) = false];
}
